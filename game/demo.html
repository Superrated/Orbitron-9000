<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbitPlayer demo</title>
<style>
  :root { --bg:#07110b; --panel:#0d1f14; --line:#1f4a2c; --green:#00ff9c; --yellow:#ffe44d; --dim:#7fa58c; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:#d8f5e2; font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:16px; max-width:760px; margin:auto }
  h1 { color:var(--green); font-size:20px; margin:0 0 4px; letter-spacing:.08em }
  p.s { color:var(--dim); margin:0 0 14px; font-size:13px }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px }
  label.file, button { background:#123322; color:var(--green); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; cursor:pointer }
  button.on { background:var(--green); color:#04130a; border-color:var(--green) }
  input[type=file] { display:none }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px }
  #list button { text-align:left; min-height:64px }
  #list small { display:block; color:var(--dim); font-size:11px }
  #list button.on small { color:#063 }
  .row { display:grid; grid-template-columns:90px 1fr 70px; gap:8px; align-items:center; margin:6px 0 }
  .row span:last-child { color:var(--yellow); text-align:right }
  input[type=range] { width:100%; accent-color:var(--yellow) }
  select { background:#123322; color:var(--green); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit }
  #beat { display:flex; gap:6px; margin-top:8px } #beat i { flex:1; height:10px; border-radius:3px; background:#123322 } #beat i.on { background:var(--yellow) }
  #pos { color:var(--dim); font-size:12px; margin-top:6px }
</style>
</head>
<body>
<h1>ORBITPLAYER</h1>
<p class="s">Baked Orbitron Sectors as game music. Open a pack folder made by <code>node tools/bake.mjs my-set.orbit</code>, or add <code>?pack=path/pack.json</code> to the address.</p>

<div class="panel">
  <label class="file">📂 Open pack folder<input id="dir" type="file" webkitdirectory multiple></label>
  <span id="info" style="margin-left:8px;color:var(--dim)"></span>
</div>

<div class="panel"><div id="list"></div></div>

<div class="panel">
  <div class="row"><span>Switch</span><select id="when"><option value="now">now</option><option value="beat">next beat</option><option value="bar" selected>next bar</option><option value="4">every 4 bars</option><option value="loop">end of loop</option></select><span></span></div>
  <div class="row"><span>Fade</span><input id="fade" type="range" min="0" max="8" step=".1" value="2"><span id="fadeV">2.0 s</span></div>
  <div class="row"><span>Low-pass</span><input id="lp" type="range" min="0" max="1" step=".001" value="1"><span id="lpV">open</span></div>
  <div class="row"><span>Warp</span><input id="warp" type="range" min=".5" max="1.5" step=".01" value="1"><span id="warpV">1.00×</span></div>
  <div class="row"><span>Volume</span><input id="vol" type="range" min="0" max="1" step=".01" value=".8"><span id="volV">80%</span></div>
  <div id="stems"></div>
  <button id="stop">■ Stop</button>
  <div id="beat"><i></i><i></i><i></i><i></i></div>
  <div id="pos"></div>
</div>

<script src="orbit-player.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const music = new OrbitPlayer({ volume: .8 });
  let playingId = null;

  function show(list) {
    $('#info').textContent = list.length + ' Sector' + (list.length > 1 ? 's' : '');
    $('#list').innerHTML = '';
    for (const s of list) {
      const b = document.createElement('button'); b.dataset.id = s.id;
      b.innerHTML = `${s.slot}. ${s.name}<small>${s.mood} · ${s.bpm} BPM · ${s.key}${s.stems ? ' · stems' : ''}</small>`;
      b.onclick = async () => { const w = $('#when').value; await music.play(s.id, { when: isNaN(+w) ? w : +w, fade: +$('#fade').value }); playingId = s.id; paint(); };
      $('#list').appendChild(b);
    }
    const hasStems = list.some(s => s.stems);
    $('#stems').innerHTML = hasStems ? ['drums', 'bass', 'music'].map(n => `<div class="row"><span>${n}</span><input data-stem="${n}" type="range" min="0" max="1" step=".01" value="1"><span>100%</span></div>`).join('') : '';
    document.querySelectorAll('[data-stem]').forEach(r => r.oninput = () => { music.layer(r.dataset.stem, +r.value, .3); r.nextElementSibling.textContent = Math.round(r.value * 100) + '%'; });
  }
  function paint() { document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', b.dataset.id === playingId)); }

  // a pack folder picked from disk: every file becomes a local blob URL
  $('#dir').onchange = async e => {
    const files = [...e.target.files], pj = files.find(f => f.name === 'pack.json');
    if (!pj) { $('#info').textContent = 'No pack.json in that folder'; return; }
    const pack = JSON.parse(await pj.text()), url = n => { const f = files.find(f => f.name === n); return f ? URL.createObjectURL(f) : n; };
    for (const s of pack.sectors) { s.file = url(s.file); if (s.stems) for (const k in s.stems) s.stems[k] = url(s.stems[k]); }
    show(await music.load(pack));
  };
  const q = new URLSearchParams(location.search).get('pack');
  if (q) music.load(q).then(show).catch(e => $('#info').textContent = e.message);

  $('#fade').oninput = e => $('#fadeV').textContent = (+e.target.value).toFixed(1) + ' s';
  $('#lp').oninput = e => { const v = +e.target.value, hz = 80 * Math.pow(250, v); music.filter(v >= .999 ? null : hz, .15); $('#lpV').textContent = v >= .999 ? 'open' : Math.round(hz) + ' Hz'; };
  $('#warp').oninput = e => { music.warp(+e.target.value, .4); $('#warpV').textContent = (+e.target.value).toFixed(2) + '×'; };
  $('#vol').oninput = e => { music.volume(+e.target.value, .1); $('#volV').textContent = Math.round(e.target.value * 100) + '%'; };
  $('#stop').onclick = () => { music.stop({ fade: +$('#fade').value || .3 }); playingId = null; paint(); };

  // the game loop: one update() per frame drives the beat lights
  const dots = [...document.querySelectorAll('#beat i')];
  music.on('beat', c => dots.forEach((d, i) => d.classList.toggle('on', i === c.beatInBar)));
  (function frame() { const c = music.update(); $('#pos').textContent = c.playing ? `${c.id} · bar ${c.bar + 1} · beat ${c.beatInBar + 1} · ${c.bpm.toFixed(1)} BPM · loop ${c.loop + 1}` : ''; if (!c.playing) dots.forEach(d => d.classList.remove('on')); requestAnimationFrame(frame); })();
</script>
</body>
</html>
